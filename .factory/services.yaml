commands:
  install: cd frontend && npm install
  typecheck: cd frontend && npx tsc --noEmit
  build: cd frontend && npm run build
  test: cd backend && ./venv/bin/python -m pytest test_api_mode.py test_corrupt_mode.py test_mode_persistence.py
  lint: cd frontend && npx eslint src --ext .ts,.tsx

services:
  backend:
    start: cd backend && ./venv/bin/python main.py
    stop: lsof -ti :8000 | xargs kill -9 2>/dev/null || true
    healthcheck: curl -sf http://localhost:8000/health
    port: 8000
    depends_on: []

  frontend:
    start: cd frontend && npm run dev
    stop: lsof -ti :3001 | xargs kill -9 2>/dev/null || true
    healthcheck: curl -sf http://localhost:3001
    port: 3001
    depends_on: [backend]
